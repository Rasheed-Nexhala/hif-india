<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HIF INDIA | Highland Islamic Forum - Registered NGO in Mangaluru</title>
    <meta name="description" content="Highland Islamic Forum (HIF INDIA) is a registered grassroots humanitarian NGO in Mangaluru. Empowering communities through Project Ashiyana housing, Chittor orphan sanctuary, masjid development, and free MEDIBANK equipment." />
    <meta name="keywords" content="HIF INDIA, Highland Islamic Forum, Mangalore NGO, Project Ashiyana, Chittor Dream Project, HIF Medibank, Masjid Development, Islamic charity Mangaluru" />
    
    <!-- OpenGraph / Social Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HIF INDIA | Highland Islamic Forum" />
    <meta property="og:description" content="100% Direct Grassroots Humanitarian Trust in Mangaluru. 29 homes built, 150+ masjids revived, 125 orphans educated, and free medical equipment." />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/projects/hif-icon.png" />
    <link rel="apple-touch-icon" href="/images/projects/hif-icon.png" />

    <!-- Google Fonts: Fraunces (editorial serif headlines) + Inter (clean sans body/UI) -->
    <script>
      (function () {
        try {
          var lang = localStorage.getItem('hif_language');
          if (lang !== 'en' && lang !== 'kn' && lang !== 'hi') lang = 'en';
          document.documentElement.lang = lang;
          document.documentElement.classList.add('lang-' + lang);

          var theme = localStorage.getItem('hif_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </head>
